name: Supabase Keep-Alive

# Keeps the free-tier Supabase project from auto-pausing after 7 days idle.
# NOTE: this only KEEPS an active project alive — it cannot wake a project that
# has already paused. If runs fail, restore the project once in the Supabase
# dashboard; the daily ping then keeps it up.

on:
  schedule:
    # Daily at 08:00 UTC. Far inside the 7-day idle window, so several runs can
    # fail transiently before the project is ever at risk of pausing.
    - cron: "0 8 * * *"
  workflow_dispatch: # Allow manual trigger from the GitHub Actions UI

# Required so the failure/recovery alert step can open and close an issue.
permissions:
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (with retries)
        id: ping
        run: |
          ATTEMPTS=3
          STATUS=000
          for i in $(seq 1 $ATTEMPTS); do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 30 \
              "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=id&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

            echo "Attempt $i/$ATTEMPTS — response status: $STATUS"

            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "Supabase is active."
              echo "status=$STATUS" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$i" -lt "$ATTEMPTS" ]; then
              echo "Retrying in 30s..."
              sleep 30
            fi
          done

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "::error::Supabase ping failed after $ATTEMPTS attempts (last status $STATUS) — the project may be paused or the secrets may be stale."
          exit 1

      # On failure: open a single tracking issue (deduped by label) so it can't
      # rot silently like it did for ~4 weeks. GitHub also emails on the failed run.
      - name: Open alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'supabase-down';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (existing.length > 0) {
              core.info(`Alert issue #${existing[0].number} already open — skipping.`);
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔴 Supabase keep-alive is failing — project likely paused',
              labels: [label],
              body: [
                'The Supabase keep-alive ping failed. The free-tier project is probably paused, or the `SUPABASE_URL` / `SUPABASE_ANON_KEY` secrets are stale.',
                '',
                '**Fix:** open the [Supabase dashboard](https://app.supabase.com), restore/resume the project, then re-run this workflow.',
                '',
                `Failed run: ${runUrl}`,
                '',
                '_This issue auto-closes once a keep-alive run succeeds._',
              ].join('\n'),
            });

      # On success: close any open alert issue so the signal self-resolves.
      - name: Close alert issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'supabase-down';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ Keep-alive succeeded — Supabase is reachable again. Closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
